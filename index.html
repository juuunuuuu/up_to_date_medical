<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily MedBrief</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 16px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: #f3f5f7;
      color: #1e293b;
      line-height: 1.65;
      word-break: keep-all;
    }
    .wrap { max-width: 540px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }
    .brand { font-size: 1.25rem; font-weight: 800; color: #334155; letter-spacing: -0.02em; }
    .date { font-size: 0.85rem; color: #64748b; font-weight: 600; }
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
    }
    .meta-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .badge {
      background: #e6f4ea;
      color: #0f766e;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 999px;
    }
    .journal { font-size: 0.84rem; color: #64748b; font-weight: 600; }
    h1 {
      font-size: 1.32rem;
      line-height: 1.42;
      margin: 0 0 10px;
      color: #0f172a;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .orig-title {
      font-size: 0.82rem;
      color: #64748b;
      line-height: 1.45;
      margin-bottom: 18px;
    }
    .takeaway {
      background: #edf7f5;
      border-radius: 14px;
      padding: 15px 16px;
      font-size: 0.94rem;
      font-weight: 700;
      color: #0f5149;
      margin-bottom: 24px;
    }
    h2 {
      font-size: 1.02rem;
      color: #0f766e;
      margin: 24px 0 10px;
      font-weight: 800;
    }
    p { margin: 0 0 12px; font-size: 0.95rem; color: #334155; }
    ul { margin: 0; padding-left: 20px; }
    li { margin-bottom: 10px; font-size: 0.94rem; color: #334155; }
    .terms-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 18px 16px;
      margin-top: 24px;
    }
    .terms-box h2 { margin-top: 0; margin-bottom: 14px; }
    .term-item { margin-bottom: 14px; }
    .term-item:last-child { margin-bottom: 0; }
    .term-title { font-weight: 800; color: #0f172a; font-size: 0.94rem; margin-bottom: 4px; }
    .term-desc { font-size: 0.9rem; color: #475569; margin: 0; }
    .pubmed-link {
      display: inline-block;
      margin-top: 22px;
      color: #0f766e;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">Daily MedBrief</div>
      <div class="date" id="date">불러오는 중...</div>
    </header>
    <main class="card" id="content">
      <p>최신 논문 브리핑을 불러오고 있습니다...</p>
    </main>
  </div>

  <script>
    fetch(`./data/papers.json?t=${Date.now()}`)
      .then(res => res.json())
      .then(data => {
        const p = Array.isArray(data) ? data[0] : data;
        document.getElementById('date').textContent = p.date || '';

        const findingsHtml = (p.key_findings || [])
          .map(item => `<li>${item}</li>`)
          .join('');

        const termsHtml = (p.key_terms || [])
          .map(t => `
            <div class="term-item">
              <div class="term-title">• ${t.term}</div>
              <p class="term-desc">${t.desc}</p>
            </div>
          `)
          .join('');

        document.getElementById('content').innerHTML = `
          <div class="meta-row">
            <span class="badge">${p.specialty || p.category || '임상의학'}</span>
            <span class="journal">${p.journal || ''}</span>
          </div>
          <h1>${p.headline || ''}</h1>
          <div class="orig-title">${p.original_title || ''}</div>
          <div class="takeaway">💡 ${p.one_line_takeaway || ''}</div>

          <h2>🩺 먼저 알아야 할 질환 이야기</h2>
          <p>${p.clinical_context || ''}</p>

          <h2>🧬 핵심 타겟과 작용 원리</h2>
          <p>${p.mechanism || ''}</p>

          <h2>📌 이번 연구에서 확인된 핵심</h2>
          <ul>${findingsHtml}</ul>

          <h2>🏥 진료실 적용 포인트</h2>
          <p>${p.clinical_pearl || ''}</p>

          <div class="terms-box">
            <h2>📖 함께 알아둘 핵심 의학 용어</h2>
            ${termsHtml}
          </div>

          <a class="pubmed-link" href="https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/" target="_blank">
            PubMed 원문 보기 (PMID: ${p.pmid}) →
          </a>
        `;
      })
      .catch(() => {
        document.getElementById('content').innerHTML =
          '<p>브리핑 데이터를 불러오지 못했습니다. GitHub Actions를 실행해 주세요.</p>';
      });
  </script>
</body>
</html>
