name: Daily Medical Research Brief

on:
  schedule:
    - cron: '30 21 * * *'  # UTC 21:30 = KST 06:30
  workflow_dispatch:       # GitHub 웹에서 수동 즉시 실행 버튼 활성화

permissions:
  contents: write          # papers.json 커밋 권한

jobs:
  fetch-and-summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai

      - name: Run PubMed fetch & Gemini summary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_paper.py

      - name: Commit and push updated papers.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/papers.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily medical brief" && git push)
